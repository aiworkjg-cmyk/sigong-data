name: Deploy sigong-upload

# PC 에서 쓰는 `azd deploy` 를 그대로 돌립니다. 배포 방법이 PC 와 GitHub 에
# 따로 있으면 한쪽만 고쳐지고 다른 쪽은 조용히 망가집니다 — 게시 프로필로
# 올리던 예전 방식이 azd 로 옮긴 뒤 몇 달 동안 실패하고 있었습니다.
#
# 로그인은 비밀번호 파일(게시 프로필) 대신 OIDC 입니다. 만료되거나 앱을 다시
# 만들면 무효가 되는 비밀값이 없습니다. 연결은 PC 에서 한 번만 합니다:
#
#   azd pipeline config
#
# 이 명령이 GitHub 저장소 변수 AZURE_CLIENT_ID · AZURE_TENANT_ID ·
# AZURE_SUBSCRIPTION_ID · AZURE_ENV_NAME · AZURE_LOCATION 을 등록합니다.
#
# 인프라(azd provision)는 여기서 돌리지 않습니다. 앱 설정의 비밀값이 Bicep
# 매개변수로 들어가므로, 코드만 올리는 배포가 인프라를 건드리지 않게 합니다.
#
# 지금은 수동 실행 전용입니다(2026-09-29). azd pipeline config 가 관리 ID 에
# 역할을 주다가 403 으로 멈췄습니다 — 로그인 계정에 역할 할당 권한(Owner 또는
# User Access Administrator)이 없습니다. 그동안 배포는 PC 에서 `azd deploy` 로
# 합니다. 권한을 받으면 azd pipeline config 를 다시 돌리고(기존 MSI
# msi-sigongdata 선택) 아래 push 트리거를 되살리면 됩니다.
on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'apps/sigong-upload/**'
  #     - 'packages/**'
  #     - 'package.json'
  #     - 'package-lock.json'
  #     - 'azure.yaml'
  #     - '.github/workflows/deploy-sigong-upload.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  # A newer commit supersedes an in-flight deploy rather than racing it.
  group: deploy-sigong-upload
  cancel-in-progress: true

jobs:
  deploy:
    # environment: 를 두지 않습니다. 두면 OIDC 주체가 "environment:production"
    # 으로 바뀌어, azd pipeline config 가 만든 "main 브랜치" 연결과 맞지 않습니다.
    runs-on: ubuntu-latest
    # 로그인 정보가 비면 azd 가 사람의 브라우저 로그인을 기다리며 멈춥니다.
    # 아래 검사로 먼저 막지만, 무엇이든 오래 걸리면 끊습니다.
    timeout-minutes: 20
    env:
      # azd 버전에 따라 변수(vars) 또는 비밀(secrets)로 등록됩니다. 둘 다 봅니다.
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME || secrets.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || secrets.AZURE_LOCATION }}
      # 리소스 그룹은 포털에서 먼저 만들어 azd 가 이름으로 찾아야 합니다.
      AZURE_RESOURCE_GROUP: sigongdata-prod
    steps:
      - name: Check azd pipeline config values
        run: |
          missing=""
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_ENV_NAME AZURE_LOCATION; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::비어 있는 값:$missing — PC 에서 'azd pipeline config' 를 다시 실행하거나 저장소 Settings > Secrets and variables > Actions 에 등록하세요."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      # 올리기 전에 막을 수 있는 것은 여기서 막습니다.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with OIDC
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --tenant-id "$AZURE_TENANT_ID" \
            --federated-credential-provider github \
            --no-prompt

      # 러너에는 .azure 폴더가 없으므로 배포 대상만 알려 주는 환경을 새로 만듭니다.
      - name: Prepare azd environment
        run: |
          azd env new "$AZURE_ENV_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" \
            --no-prompt
          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"

      # azure.yaml 의 prepackage 훅이 빌드와 배포 폴더 준비를 합니다(PC 와 같음).
      - name: Deploy
        run: azd deploy --no-prompt
